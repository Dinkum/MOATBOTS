[project]
name = "moatbots"
version = "0.1.1"
description = "Team runtime around Hermes: persistent rooms, coordination, and event-driven wakes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = [
  "aiosqlite==0.21.0",
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "greenlet==3.2.4",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "pyyaml==6.0.2",
  "sqlalchemy==2.0.41",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.0.0",
  "ruff==0.12.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
exclude-newer = "2026-07-31T00:00:00Z"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".moatbots-agents",
  ".moatbots-auth",
  ".moatbots-desktop",
  ".moatbots-home",
  ".moatbots-kanban",
  ".vendor",
  "data",
  "workspace",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/routes/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
